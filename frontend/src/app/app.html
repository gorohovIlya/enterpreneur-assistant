<main style="padding: 2rem; font-family: sans-serif;">
  <h1>Entrepreneur Assistant</h1>

  @if (serverStatus(); as info) {
    <div style="padding: 1rem; background: #e6ffed; border: 1px solid #34d058; border-radius: 6px;">
      <strong>Статус сервера:</strong> {{ info.status }} <br>
      <strong>Сообщение:</strong> {{ info.message }}
    </div>
  } @else if (errorMessage()) {
    <div style="padding: 1rem; background: #ffeef0; border: 1px solid #d73a49; border-radius: 6px;">
      {{ errorMessage() }}
    </div>
  } @else {
    <p>Подключение к серверу...</p>
  }
</main>
