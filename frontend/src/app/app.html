<div class="layout">
  <header class="site-header">
    <div class="container site-header__inner">
      <a routerLink="/" class="brand" aria-label="На главную">
        <span class="brand__mark" aria-hidden="true">ОПФ</span>
        <span class="brand__text">
          <span class="brand__title">Помощник предпринимателя</span>
          <span class="brand__subtitle">выбор организационно-правовой формы</span>
        </span>
      </a>

      <nav class="site-nav" aria-label="Основная навигация">
        <a
          routerLink="/"
          routerLinkActive="site-nav__link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="site-nav__link"
        >
          Главная
        </a>
        <a routerLink="/recommend" routerLinkActive="site-nav__link--active" class="site-nav__link">
          Подобрать ОПФ
        </a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© 2026 Помощник предпринимателя</span>
      <span>Рекомендации носят информационный характер</span>
    </div>
  </footer>
</div>
