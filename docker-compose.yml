services:
  backend:
    build:
      context: ./backend
    container_name: assistant-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: assistant-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
