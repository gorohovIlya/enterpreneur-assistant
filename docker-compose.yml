services:
  backend:
    build:
      context: ./backend
    container_name: assistant-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROMPT_PATH: /app/prompt.md
    volumes:
      - ./prompt.md:/app/prompt.md:ro
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: assistant-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
